[project]
name = "tatm"
version = "0.1.0"
description = "Trie-Aware Tool Memory research pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyarrow>=20.0.0,<24",
    "tokenizers>=0.21.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tatm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
